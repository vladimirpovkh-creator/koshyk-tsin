name: Update store prices (experimental)
on:
  schedule:
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Collect public catalog product data
        run: python scripts/collect_prices.py
      - name: Commit resulting JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified structured prices"
            git push
          fi
