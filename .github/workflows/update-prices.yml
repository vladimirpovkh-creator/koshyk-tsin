name: Update store prices
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"
  push:
    paths:
      - 'scripts/collect_prices.py'
      - '.github/workflows/update-prices.yml'
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector syntax
        run: python -m py_compile scripts/collect_prices.py
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Collect offers
        id: scrape
        continue-on-error: true
        run: python scripts/collect_prices.py
      - name: Summarize source results
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("data/status.json")
          if not p.exists():
              print("Collector did not write status.json")
          else:
              data=json.loads(p.read_text())
              print("Retrieved:",data.get("total",0))
              for name,source in data.get("sources",{}).items():
                  print(name,source.get("status"),source.get("count"),source.get("error",""))
          PY
      - name: Commit collected data
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update promotion data"
            git pull --rebase
            git push
          fi
      - name: Report scraping failures
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Price collector crashed. Inspect the 'Collect offers' step for the traceback."
          exit 1
