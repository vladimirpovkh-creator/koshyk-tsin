name: Update store prices
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"
  push:
    paths:
      - 'scripts/collect_prices.py'
      - '.github/workflows/update-prices.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector with persistent diagnostic report
        shell: bash
        run: |
          mkdir -p data
          python -m py_compile scripts/collect_prices.py > data/collector-log.txt 2>&1
          compile_code=$?
          if [ "$compile_code" -eq 0 ]; then
            python -m pip install playwright==1.56.0 >> data/collector-log.txt 2>&1
            pip_code=$?
            if [ "$pip_code" -eq 0 ]; then
              python -m playwright install chromium >> data/collector-log.txt 2>&1
              install_code=$?
              if [ "$install_code" -eq 0 ]; then
                python scripts/collect_prices.py >> data/collector-log.txt 2>&1
                echo "collector exit: $?" >> data/collector-log.txt
              else
                echo "chromium install exit: $install_code" >> data/collector-log.txt
              fi
            else
              echo "pip install exit: $pip_code" >> data/collector-log.txt
            fi
          else
            echo "syntax check exit: $compile_code" >> data/collector-log.txt
          fi
          tail -n 70 data/collector-log.txt
      - name: Commit data and diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/status.json data/collector-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: collector data and diagnostics"
            git pull --rebase
            git push
          fi
