name: Update store promotions individually
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"
  push:
    paths:
      - 'scripts/collect_store.py'
      - 'scripts/collect_prices.py'
      - 'tests/test_official_novus.py'
      - 'scripts/merge_stores.py'
      - '.github/workflows/update-prices.yml'
permissions:
  contents: write
concurrency:
  group: prices-update
  cancel-in-progress: false
jobs:
  retailer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: [metro, novus, novus_official, fora, silpo, atb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check collector Python syntax
        run: python -m py_compile scripts/collect_prices.py scripts/collect_store.py scripts/merge_stores.py
      - name: Test official NOVUS card and price extraction
        if: matrix.store == 'novus_official'
        run: python tests/test_official_novus.py
      - name: Collect retailer offers
        run: python scripts/collect_store.py --store ${{ matrix.store }}
      - name: Upload retailer result
        uses: actions/upload-artifact@v4
        with:
          name: offers-${{ matrix.store }}
          path: |
            data/stores/${{ matrix.store }}.json
            data/stores/${{ matrix.store }}-status.json
          if-no-files-found: error
  merge:
    needs: retailer
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download available retailer results
        uses: actions/download-artifact@v4
        with:
          pattern: offers-*
          path: data/stores/
          merge-multiple: true
      - name: Merge verified offers
        run: python scripts/merge_stores.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep generated artifacts from this run, rebase CODE only by resetting
          # onto the latest main and re-applying the generated files. Never merge
          # competing JSON blobs with git pull --rebase.
          mkdir -p /tmp/price-run
          cp -a data/stores /tmp/price-run/stores
          cp data/offers.json data/status.json /tmp/price-run/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -a /tmp/price-run/stores/. data/stores/
            cp /tmp/price-run/offers.json /tmp/price-run/status.json data/
            git add data/stores/ data/offers.json data/status.json
            if git diff --cached --quiet; then
              echo "No catalog changes to publish"
              exit 0
            fi
            git commit -m "chore: refresh independent retailer catalogs"
            if git push origin HEAD:main; then
              echo "Catalog published"
              exit 0
            fi
            echo "Concurrent update detected; retrying from latest main"
          done
          echo "Catalog publication failed after retries" >&2
          exit 1
