name: Update store promotions individually
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Оновити всі магазини (за замовчуванням тестувати лише METRO)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 5,11,17 * * *"
  push:
    paths:
      - 'scripts/collect_store.py'
      - 'scripts/metro_official.py'
      - 'scripts/metro_catalog_pdf.py'
      - 'tests/test_metro_catalog_pdf.py'
      - 'tests/test_metro_official.py'
      - 'scripts/atb_public_probe.py'
      - 'scripts/atb_economy.py'
      - 'scripts/atb_economy_html.py'
      - 'tests/test_atb_economy_html.py'
      - 'tests/test_atb_economy.py'
      - 'tests/test_atb_public_probe.py'
      - 'tests/test_collect_store_imports.py'
      - 'scripts/collect_prices.py'
      - 'scripts/categories.py'
      - 'data/category_rules.json'
      - 'tests/test_categories.py'
      - 'scripts/audit_categories.py'
      - 'tests/test_category_audit.py'
      - 'tests/test_zakaz_pagination.py'
      - 'scripts/audit_catalog.py'
      - 'tests/test_catalog_quality.py'
      - 'tests/test_fora_catalog.py'
      - 'scripts/silpo_app_probe.py'
      - 'scripts/silpo_app_catalog.py'
      - 'scripts/price_units.py'
      - 'scripts/silpo_catalog_quality.py'
      - 'tests/test_silpo_catalog_quality.py'
      - 'tests/test_price_units.py'
      - 'tests/test_silpo_app_catalog.py'
      - 'tests/test_silpo_app_probe.py'
      - 'tests/test_official_novus.py'
      - 'scripts/merge_stores.py'
      - '.github/workflows/update-prices.yml'
permissions:
  contents: write
concurrency:
  group: prices-update
  cancel-in-progress: false
jobs:
  retailer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_refresh == true) && '["metro","novus","novus_official","fora","silpo","atb"]' || '["metro"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check collector Python syntax
        run: python -m py_compile scripts/audit_catalog.py scripts/metro_official.py scripts/collect_prices.py scripts/collect_store.py scripts/silpo_app_probe.py scripts/silpo_app_catalog.py scripts/price_units.py scripts/silpo_catalog_quality.py scripts/atb_public_probe.py scripts/atb_economy.py scripts/atb_economy_html.py scripts/categories.py scripts/merge_stores.py
      - name: Test NOVUS catalog quality checks
        if: matrix.store == 'novus'
        run: python tests/test_catalog_quality.py
      - name: Install official METRO PDF inspection library
        if: matrix.store == 'metro'
        run: python -m pip install pypdf==6.1.3 PyMuPDF==1.26.5
      - name: Test official METRO PDF price coordinates
        if: matrix.store == 'metro'
        run: python tests/test_metro_catalog_pdf.py
      - name: Test official METRO promotional prices
        if: matrix.store == 'metro'
        run: python tests/test_metro_official.py
      - name: Test Zakaz page traversal
        if: matrix.store == 'novus'
        run: python tests/test_zakaz_pagination.py
      - name: Test Fora page-window collection
        if: matrix.store == 'fora'
        run: python tests/test_fora_catalog.py
      - name: Test automatic category conflict audit
        if: matrix.store == 'silpo'
        run: python tests/test_category_audit.py
      - name: Test detailed categories and JavaScript/Python agreement
        if: matrix.store == 'silpo'
        run: python tests/test_categories.py
      - name: Test official NOVUS card and price extraction
        if: matrix.store == 'novus_official'
        run: python tests/test_official_novus.py
      - name: Test pack size and comparable unit prices
        if: matrix.store == 'silpo'
        run: python tests/test_price_units.py
      - name: Test Silpo catalog quality gate
        if: matrix.store == 'silpo'
        run: python tests/test_silpo_catalog_quality.py
      - name: Test verified and bounded Silpo app prices
        if: matrix.store == 'silpo'
        run: python tests/test_silpo_app_catalog.py
      - name: Test anonymous Silpo app-catalog diagnostics
        if: matrix.store == 'silpo'
        run: python tests/test_silpo_app_probe.py
      - name: Test isolation of retailer-specific parser dependencies
        if: matrix.store == 'silpo'
        run: python tests/test_collect_store_imports.py
      - name: Install ATB HTML parser
        if: matrix.store == 'atb'
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Test ATB public HTML card extraction
        if: matrix.store == 'atb'
        run: python tests/test_atb_economy_html.py
      - name: Test ATB strict Economy product card normalization
        if: matrix.store == 'atb'
        run: python tests/test_atb_economy.py
      - name: Test ATB public catalog connectivity probe
        if: matrix.store == 'atb'
        run: python tests/test_atb_public_probe.py
      - name: Collect retailer offers
        run: python scripts/collect_store.py --store ${{ matrix.store }}
      - name: Summarize actual retailer data status
        if: always()
        env:
          STORE: ${{ matrix.store }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          store=os.environ['STORE']
          path=Path('data/stores')/f'{store}-status.json'
          try:
              data=json.loads(path.read_text(encoding='utf-8'))
              status=data.get('status','unknown')
              count=data.get('count',0)
              error=data.get('error','')
          except Exception as exc:
              status='error';count=0;error=f'Missing or invalid status: {exc}'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(f'### {store}: {status} — {count} offers\n\n')
              if error:
                  out.write(f'Error: {error}\n\n')
          print(f'{store}: {status}, {count} offers; {error}')
          if status!='ok':
              print(f'::warning title={store} offers unavailable::{status}: {error or "No verified offers"}')
          PY
      - name: Upload retailer result
        uses: actions/upload-artifact@v4
        with:
          name: offers-${{ matrix.store }}
          path: |
            data/stores/${{ matrix.store }}.json
            data/stores/${{ matrix.store }}-status.json
          if-no-files-found: error
  merge:
    needs: retailer
    # Testing only METRO must never overwrite the combined storefront
    # using stale or missing artifacts from all other retailers.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.full_refresh == true) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download available retailer results
        uses: actions/download-artifact@v4
        with:
          pattern: offers-*
          path: data/stores/
          merge-multiple: true
      - name: Merge verified offers
        run: python scripts/merge_stores.py
      - name: Audit category assignments in entire published catalog
        run: |
          cp data/category_audit.json /tmp/category-audit.json
          python - <<'PY'
          import json, os
          report=json.load(open('/tmp/category-audit.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### Категорії: автоматичний аудит\n\n')
              out.write(f'Перевірено: {report["checked"]} · Підозрілих: {report["flagged"]} ({report["flaggedSharePct"]}%)\n\n')
              out.write(f'У категорії «Інші товари»: {report["uncategorizedCount"]}\\n\\n')
              for category,count in sorted(report['flaggedByCategory'].items(),key=lambda x:-x[1]):
                  out.write(f'- {category}: {count}\n')
                  for item in report['samples'].get(category,[])[:4]:
                      out.write(f'  - {item["name"]} ({item["store"]})\n')
          print('CATEGORY AUDIT: checked',report['checked'],'flagged',report['flagged'])
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep generated artifacts from this run, rebase CODE only by resetting
          # onto the latest main and re-applying the generated files. Never merge
          # competing JSON blobs with git pull --rebase.
          mkdir -p /tmp/price-run
          cp -a data/stores /tmp/price-run/stores
          cp data/offers.json data/status.json data/category_audit.json /tmp/price-run/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -a /tmp/price-run/stores/. data/stores/
            cp /tmp/price-run/offers.json /tmp/price-run/status.json /tmp/price-run/category_audit.json data/
            git add data/stores/ data/offers.json data/status.json data/category_audit.json
            if git diff --cached --quiet; then
              echo "No catalog changes to publish"
              exit 0
            fi
            git commit -m "chore: refresh independent retailer catalogs"
            if git push origin HEAD:main; then
              echo "Catalog published"
              exit 0
            fi
            echo "Concurrent update detected; retrying from latest main"
          done
          echo "Catalog publication failed after retries" >&2
          exit 1
