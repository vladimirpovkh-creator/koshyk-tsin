name: Full offline regression suite
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/category_rules.json'
      - '.github/workflows/full-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: |
          python -m pip install playwright==1.56.0 beautifulsoup4==4.14.2 pypdf==6.1.3 PyMuPDF==1.26.5
          python -m playwright install --with-deps chromium
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Run all offline regression scripts
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done
